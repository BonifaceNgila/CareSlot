name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint & test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careslot
          POSTGRES_PASSWORD: careslot
          POSTGRES_DB: careslot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careslot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://careslot:careslot@localhost:5432/careslot
      DJANGO_SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test scheduling -v 2

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t careslot:${{ github.sha }} .

  deploy:
    name: Deploy to OCI
    needs: [test, docker]
    # Only after a merge (push) to main, never for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      TARGET: ${{ vars.OCI_USER }}@${{ vars.OCI_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" || { echo "::error::Set OCI_SSH_KEY and OCI_KNOWN_HOSTS secrets"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Pinned host key: the job refuses to connect if the server's identity changes.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      # Mirror the merged code to the server. Server-only files (secrets, backups, lock) are excluded,
      # so --delete never touches them; files removed from the repo are removed on the server.
      - name: Upload code
        run: |
          rsync -az --delete \
            --exclude=.git/ \
            --exclude=deploy/oci/.env \
            --exclude=deploy/oci/backups/ \
            --exclude=deploy/oci/.deploy.lock \
            ./ "$TARGET:CareSlot/"

      # deploy.sh builds the image, migrates once, restarts the containers and checks that
      # https://<domain>/health reports this commit.
      - name: Deploy
        run: ssh "$TARGET" "cd CareSlot && sudo GIT_COMMIT=$GITHUB_SHA bash deploy/oci/deploy.sh"

      - name: Check the live site
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          live=$(curl --silent --fail --max-time 30 "$APP_URL/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')
          test "$live" = "$GITHUB_SHA" || { echo "::error::Live commit is '$live', expected $GITHUB_SHA"; exit 1; }
          echo "$GITHUB_SHA is live at $APP_URL"
