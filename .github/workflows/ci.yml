name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint & test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careslot
          POSTGRES_PASSWORD: careslot
          POSTGRES_DB: careslot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careslot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://careslot:careslot@localhost:5432/careslot
      DJANGO_SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test scheduling -v 2

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t careslot:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    needs: [test, docker]
    # Only after a merge (push) to main, never for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo "::error::Set the RENDER_DEPLOY_HOOK secret"; exit 1; }
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
      - name: Wait until this commit is live
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL variable not set; skipping live check"; exit 0; fi
          for attempt in $(seq 1 60); do
            live=$(curl --silent --max-time 30 "$APP_URL/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Deployed $GITHUB_SHA"; exit 0; fi
            echo "Attempt $attempt: live commit is '${live:-unreachable}', waiting..."
            sleep 15
          done
          echo "::error::$GITHUB_SHA was not live after 15 minutes"; exit 1
